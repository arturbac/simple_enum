name: C++ CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: ${{ matrix.compiler }}-${{ matrix.version }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [ clang ]
        version: [ 19, 20, 23 ]
        preset:
          - ci-clang-libstdc++
          - ci-module-clang-libstdc++
          - ci-clang-libc++
          - ci-module-clang-libc++
          - ci-clang-libstdc++-c++26
          - ci-clang-libc++-c++26
        exclude:
          - { version: 19, preset: ci-module-clang-libstdc++ }
          - { version: 19, preset: ci-clang-libstdc++-c++26 }
          - { version: 19, preset: ci-clang-libc++-c++26 }
        include:
          - { compiler: gcc, version: 14, preset: ci-gcc }
          - { compiler: gcc, version: 14, preset: ci-gcc-c++26 }
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
    - uses: actions/checkout@v4

    - uses: lukka/get-cmake@latest

    - name: Install clang ${{ matrix.version }}
      if: matrix.compiler == 'clang'
      run: |
        V=${{ matrix.version }}
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$V main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends clang-$V libc++-$V-dev libc++abi-$V-dev clang-tools-$V
        echo "/usr/lib/llvm-$V/bin" >> $GITHUB_PATH

    - name: Select gcc ${{ matrix.version }}
      if: matrix.compiler == 'gcc'
      run: |
        mkdir -p $HOME/.local/gcc-bin
        ln -s /usr/bin/gcc-${{ matrix.version }} $HOME/.local/gcc-bin/gcc
        ln -s /usr/bin/g++-${{ matrix.version }} $HOME/.local/gcc-bin/g++
        echo "$HOME/.local/gcc-bin" >> $GITHUB_PATH

    - name: Compiler version
      run: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} --version

    # glaze is tracked from main, so the dependency cache is refreshed daily
    - name: Cache key date
      id: date
      run: echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

    - name: Cache CPM sources
      uses: actions/cache@v4
      with:
        path: ~/.cache/CPM
        key: cpm-linux-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/get_cpm.cmake') }}-${{ steps.date.outputs.date }}

    - name: Set CPM cache dir
      run: echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> $GITHUB_ENV

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.preset }}
        max-size: 200M

    - name: ${{ matrix.preset }}
      run: cmake --workflow --preset="${{ matrix.preset }}"

  build-and-test-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache key date
      id: date
      shell: bash
      run: echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

    - name: Cache CPM sources
      uses: actions/cache@v4
      with:
        path: ~/.cache/CPM
        key: cpm-windows-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/get_cpm.cmake') }}-${{ steps.date.outputs.date }}

    - name: Set CPM cache dir
      run: echo "CPM_SOURCE_CACHE=$HOME\.cache\CPM" >> $env:GITHUB_ENV

    - name: Configure MSVC
      run: cmake -B ${{github.workspace}}/build/msvc -DCMAKE_BUILD_TYPE=Release
    - name: Build MSVC
      run: cmake --build ${{github.workspace}}/build/msvc
    - name: Test MSVC
      working-directory: ${{github.workspace}}/build/msvc
      run: ctest -C Debug
